[theme]
base = "dark"
primaryColor = "#E2603D"
backgroundColor = "#0A0E0D"
secondaryBackgroundColor = "#0F1514"
textColor = "#E9EFEB"

[server]
# Watcher is off because watchdog's Windows directory-change reader crashed on the
# machine this was built on. Set to "auto" if you want hot reload while editing.
fileWatcherType = "none"
maxUploadSize = 100

[browser]
gatherUsageStats = false
